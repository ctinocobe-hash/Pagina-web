<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="/manifest.json" />
  <title>TINOCO · Firma Legal · Derecho Fiscal, Aduanero y Administrativo en Irapuato</title>

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TINOCO · Firma Legal" />
  <meta property="og:url" content="https://tinoco.legal/" />
  <meta property="og:title" content="TINOCO · Firma Legal" />
  <meta property="og:description" content="Despacho de litigio fiscal, aduanero y administrativo en Irapuato, Guanajuato. Defensa ante el SAT, auditorías, PAMA y recursos de revocación." />
  <meta property="og:image" content="https://tinoco.legal/og/tinoco-legal.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TINOCO · Firma Legal" />
  <meta name="twitter:description" content="Despacho de litigio fiscal, aduanero y administrativo en Irapuato, Guanajuato." />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LegalService",
    "name": "TINOCO Firma Legal",
    "url": "https://tinoco.legal/",
    "image": "https://tinoco.legal/og/tinoco-legal.png",
    "telephone": "+52-462-252-8399",
    "email": "contacto@tinoco.legal",
    "areaServed": {
      "@type": "City",
      "name": "Irapuato"
    },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Irapuato",
      "addressRegion": "Guanajuato",
      "addressCountry": "MX"
    },
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
      "opens": "09:00",
      "closes": "18:00"
    },
    "priceRange": "$$",
    "knowsAbout": ["Derecho administrativo", "Derecho fiscal", "Derecho aduanero"]
  }

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Source Sans 3', system-ui, sans-serif; background: #1D3647; color: #F3F2EF; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(164,171,179,0.2); }
    input, select, textarea { font-family: inherit; }

    /* ── Estilos del sitio ─────────────────────────────────────────────
       Vive aquí, estático, y no dentro del componente de React: es CSS
       fijo que no depende de props ni de estado, y tenerlo como parte del
       árbol de React obligaba a hidratarlo como si pudiera cambiar, lo que
       producía un mismatch de hidratación en cada carga (ver prerender). */
    @keyframes draw    { to { stroke-dashoffset: 0; } }
    @keyframes fadeUp  { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

    /* ── Sistema de padding horizontal ─────────────────────────── */
    /* Aplicar siempre a: header, sections, footer.
       Los paddings verticales van en el inline style de cada elemento. */
    .px { padding-left: 64px; padding-right: 64px; }

    /* ── Tipografía responsive ──────────────────────────────────── */
    .hero-h1    { font-family:'EB Garamond', Georgia, serif; font-weight:400; font-size:96px; line-height:1.1; color:#F3F2EF; width:min(980px,100%); margin:40px 0 0; overflow-wrap:break-word; }
    .hero-eyebrow { font-family:'Source Sans 3', system-ui, sans-serif; font-size:12px; letter-spacing:4px; color:#A4ABB3; }
    .hero-p     { font-family:'Source Sans 3', system-ui, sans-serif; font-size:18px; line-height:1.7; font-weight:300; color:#C7CCD2; width:min(620px,100%); margin:34px 0 0; }
    .hero-btns  { display:flex; gap:20px; margin-top:84px; flex-wrap:wrap; justify-content:center; }

    /* ── Titulares de sección ───────────────────────────────────── */
    .firma-main-h2    { font-family:'EB Garamond', Georgia, serif; font-weight:400; font-size:52px; line-height:1.2; text-align:center; max-width:900px; margin:0 auto; color:#16181D; }
    .contacto-info-h2 { font-family:'EB Garamond', Georgia, serif; font-weight:400; font-size:56px; line-height:1.15; margin:26px 0 0; color:#16181D; }

    /* ── Botones ────────────────────────────────────────────────── */
    .btn-border  { font-family:'Source Sans 3', system-ui, sans-serif; font-size:12px; letter-spacing:2.5px; color:#F3F2EF; text-decoration:none; border:1px solid rgba(164,171,179,.55); padding:14px 26px; transition:background .35s, color .35s; cursor:pointer; background:transparent; display:inline-block; }
    .btn-border:hover  { background:#F3F2EF; color:#16181D; }
    .btn-solid   { font-family:'Source Sans 3', system-ui, sans-serif; font-size:13px; letter-spacing:2.5px; color:#1D3647; background:#F3F2EF; text-decoration:none; padding:18px 36px; display:inline-block; transition:background .35s; cursor:pointer; border:none; text-align:center; }
    .btn-solid:hover   { background:#DCDAD3; }
    .btn-outline { font-family:'Source Sans 3', system-ui, sans-serif; font-size:13px; letter-spacing:2.5px; color:#F3F2EF; border:1px solid rgba(164,171,179,.55); text-decoration:none; padding:18px 36px; display:inline-block; transition:background .35s, color .35s; cursor:pointer; background:transparent; text-align:center; }
    .btn-outline:hover { background:#F3F2EF; color:#16181D; }

    /* ── Nav ────────────────────────────────────────────────────── */
    .nav-a { font-family:'Source Sans 3', system-ui, sans-serif; font-size:12px; letter-spacing:2.5px; color:#F3F2EF; text-decoration:none; cursor:pointer; transition:color .3s; white-space:nowrap; }
    .nav-a:hover { color:#A4ABB3; }

    /* ── Áreas ──────────────────────────────────────────────────── */
    .area-row { display:grid; grid-template-columns:120px 1fr 48px; gap:32px; align-items:center; padding:44px 0; border-bottom:1px solid rgba(164,171,179,.22); transition:background .35s, padding-left .3s; }
    .area-row:hover { background:rgba(36,67,90,.35); padding-left:12px; }
    .area-num   { font-family:'EB Garamond', Georgia, serif; font-size:48px; color:#485769; line-height:1; }
    .area-title { font-family:'EB Garamond', Georgia, serif; font-weight:400; font-size:34px; color:#F3F2EF; margin-bottom:10px; }
    .area-desc  { font-family:'Source Sans 3', system-ui, sans-serif; font-size:15.5px; line-height:1.65; color:#A4ABB3; }
    .area-arrow { font-family:'EB Garamond', Georgia, serif; font-size:30px; color:#485769; text-align:right; }

    /* ── Principios ─────────────────────────────────────────────── */
    .principios-grid { display:grid; grid-template-columns:1fr 1fr 1fr; border-top:1px solid rgba(22,24,29,.14); border-bottom:1px solid rgba(22,24,29,.14); }
    .principio-col { padding:48px 44px; display:flex; flex-direction:column; gap:16px; transition:background .35s; }
    .principio-col:not(:last-child) { border-right:1px solid rgba(22,24,29,.14); }
    .principio-num   { font-family:'EB Garamond', Georgia, serif; font-size:30px; color:#485769; }
    .principio-titulo{ font-family:'Source Sans 3', system-ui, sans-serif; font-size:12px; letter-spacing:3px; font-weight:600; color:#16181D; }
    .principio-desc  { font-family:'Source Sans 3', system-ui, sans-serif; font-size:15.5px; line-height:1.7; color:#485769; }

    /* ── La Firma: bloque "sobre" ───────────────────────────────── */
    .firma-sobre { display:grid; grid-template-columns:280px 1fr; gap:48px; margin-top:72px; }
    .firma-label { font-family:'Source Sans 3', system-ui, sans-serif; font-size:12px; letter-spacing:4px; color:#485769; padding-top:10px; }
    .firma-h3    { font-family:'EB Garamond', Georgia, serif; font-weight:400; font-size:42px; line-height:1.25; max-width:820px; color:#16181D; }
    .firma-cols  { display:grid; grid-template-columns:1fr 1fr; gap:48px; margin-top:40px; }
    .firma-p     { font-family:'Source Sans 3', system-ui, sans-serif; font-size:16px; line-height:1.75; color:#485769; }

    /* ── Publicaciones ──────────────────────────────────────────── */
    .pub-row { display:grid; grid-template-columns:160px 1fr 280px 48px; gap:32px; align-items:baseline; padding:38px 0; border-bottom:1px solid rgba(164,171,179,.22); text-decoration:none; color:#F3F2EF; transition:background .35s, padding-left .3s; }
    .pub-row:hover { background:rgba(36,67,90,.4); padding-left:12px; }
    .pub-cat   { font-family:'Source Sans 3', system-ui, sans-serif; font-size:11px; letter-spacing:2.5px; color:#A4ABB3; }
    .pub-titulo{ font-family:'EB Garamond', Georgia, serif; font-weight:400; font-size:28px; line-height:1.25; }
    .pub-extr  { font-family:'Source Sans 3', system-ui, sans-serif; font-size:14.5px; line-height:1.6; color:#A4ABB3; }
    .pub-arrow { font-family:'EB Garamond', Georgia, serif; font-size:26px; color:#485769; text-align:right; }

    /* ── Contacto ───────────────────────────────────────────────── */
    .contacto-grid { display:grid; grid-template-columns:1fr 1fr; gap:72px; align-items:start; max-width:1200px; margin:0 auto; }
    .contact-row { display:flex; justify-content:space-between; align-items:baseline; padding:26px 4px; border-bottom:1px solid rgba(22,24,29,.16); text-decoration:none; color:#16181D; transition:background .3s; }
    .contact-row:hover { background:rgba(22,24,29,.04); }
    .contact-row-label { font-family:'Source Sans 3', system-ui, sans-serif; font-size:11px; letter-spacing:3px; color:#485769; }
    .contact-row-value { font-family:'EB Garamond', Georgia, serif; font-size:24px; }
    .inp { width:100%; padding:12px 14px; background:rgba(22,24,29,.06); border:1px solid rgba(22,24,29,.16); color:#16181D; font-family:'Source Sans 3', system-ui, sans-serif; font-size:14px; outline:none; transition:border-color .3s; box-sizing:border-box; }
    .inp:focus { border-color:#485769; }
    .inp::placeholder { color:#485769; opacity:.55; }
    .form-label { display:block; font-family:'Source Sans 3', system-ui, sans-serif; font-size:10px; letter-spacing:2.5px; color:#485769; margin-bottom:6px; }
    .form-field { margin-bottom:16px; }
    .btn-submit { width:100%; padding:16px; background:#16181D; color:#F3F2EF; border:none; font-family:'Source Sans 3', system-ui, sans-serif; font-size:13px; letter-spacing:2.5px; cursor:pointer; transition:background .3s; }
    .btn-submit:hover { background:#1D3647; }
    .btn-submit:disabled { opacity:.7; cursor:wait; }

    /* ── Footer ─────────────────────────────────────────────────── */
    .footer-inner { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }

    /* MOBILE ≤ 768px */
    @media (max-width: 768px) {
      .px { padding-left: 20px; padding-right: 20px; }
      .hide-mobile { display:none !important; }
      .show-mobile { display:flex !important; }
      .header-logo { height:36px !important; }
      #inicio { align-items:flex-start !important; min-height:520px !important; padding-top:80px !important; padding-bottom:88px !important; }
      .hero-watermark { top:34% !important; }
      .hero-h1 { font-size:38px !important; margin:22px 0 0 !important; max-width:calc(100vw - 40px) !important; overflow-wrap:break-word !important; word-break:break-word !important; line-height:1.15 !important; }
      .hero-eyebrow { font-size:10px !important; letter-spacing:2px !important; }
      .hero-p  { font-size:16px !important; margin:20px 0 0 !important; max-width:calc(100vw - 40px) !important; }
      .hero-btns { flex-direction:column !important; align-items:stretch !important; margin-top:56px !important; gap:12px !important; width:calc(100vw - 40px) !important; max-width:360px !important; }
      .hero-btns > * { padding:16px 20px !important; text-align:center !important; width:100% !important; box-sizing:border-box !important; }
      .firma-main-h2    { font-size:28px !important; }
      .contacto-info-h2 { font-size:34px !important; margin:18px 0 0 !important; }
      .area-row { grid-template-columns:52px 1fr !important; gap:16px !important; padding:32px 0 !important; }
      .area-num   { font-size:34px !important; }
      .area-title { font-size:24px !important; margin-bottom:8px !important; }
      .area-desc  { font-size:14px !important; }
      .area-arrow { display:none !important; }
      .principios-grid { grid-template-columns:1fr !important; }
      .principio-col { padding:32px 24px !important; border-right:none !important; border-bottom:1px solid rgba(22,24,29,.14) !important; }
      .principio-col:last-child { border-bottom:none !important; }
      .firma-sobre { grid-template-columns:1fr !important; gap:24px !important; margin-top:48px !important; }
      .firma-label { padding-top:0 !important; }
      .firma-h3    { font-size:30px !important; }
      .firma-cols  { grid-template-columns:1fr !important; gap:20px !important; margin-top:24px !important; }
      .firma-p     { font-size:15px !important; }
      .pub-row   { grid-template-columns:1fr !important; gap:10px !important; padding:28px 0 !important; }
      .pub-cat   { font-size:10px !important; }
      .pub-titulo{ font-size:22px !important; }
      .pub-extr  { display:none !important; }
      .pub-arrow { display:none !important; }
      .contacto-grid { grid-template-columns:1fr !important; gap:48px !important; }
      .contact-row-value { font-size:18px !important; }
      .footer-inner { flex-direction:column !important; align-items:flex-start !important; }
    }
    @media (min-width: 769px) {
      .show-mobile { display:none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
